<!DOCTYPE html>
<html>
<head>
  <title>My Browser</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #f5f5f5;
      padding-top: 80px;
    }

    h1 {
      font-size: 32px;
    }

    input {
      width: 70%;
      max-width: 500px;
      padding: 15px;
      border-radius: 25px;
      border: 1px solid #ddd;
      font-size: 16px;
    }

    button {
      margin-top: 15px;
      padding: 12px 25px;
      border: none;
      border-radius: 20px;
      cursor: pointer;
    }

    #results {
      margin: 30px auto;
      max-width: 700px;
      text-align: left;
    }

    .result {
      background: white;
      padding: 15px;
      margin: 10px 0;
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <h1>🌐 My Browser</h1>

  <input id="searchBox" type="text" placeholder="Search the web...">
  <br>

  <button onclick="search()">🔍 Search</button>

  <div id="results"></div>

  <script>
    function search() {
      let query = document.getElementById("searchBox").value;

      if (query.trim() === "") {
        return;
      }

      document.getElementById("results").innerHTML =
        "<div class='result'><h3>Search</h3>" +
        "<p>You searched for: <b>" + query + "</b></p>" +
        "<p>Real Internet search will be connected next.</p></div>";
    }
  </script>

</body>
</html>


<!DOCTYPE html>
<html>
<head>
  <title>My Browser</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      text-align: center;
    }

    .top {
      text-align: right;
      padding: 20px;
    }

    .top button {
      border: none;
      background: white;
      padding: 10px 15px;
      border-radius: 20px;
    }

    .logo {
      font-size: 50px;
      font-weight: bold;
      margin-top: 100px;
    }

    .search {
      width: 80%;
      max-width: 600px;
      padding: 16px;
      border: 1px solid #ddd;
      border-radius: 30px;
      font-size: 18px;
      outline: none;
    }

    .buttons {
      margin-top: 25px;
    }

    .buttons button {
      padding: 12px 20px;
      margin: 5px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .shortcuts {
      margin-top: 40px;
    }

    .shortcut {
      display: inline-block;
      background: white;
      padding: 15px 20px;
      margin: 5px;
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <div class="top">
    <button>☰ Menu</button>
  </div>

  <div class="logo">
    🌐 My Browser
  </div>

  <input
    class="search"
    type="text"
    placeholder="Search the web..."
  >

  <div class="buttons">
    <button>🔍 Search</button>
    <button>✨ I'm Feeling Lucky</button>
  </div>

  <div class="shortcuts">
    <div class="shortcut">🌐 Google</div>
    <div class="shortcut">▶️ YouTube</div>
    <div class="shortcut">💻 GitHub</div>
  </div>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <title>My Browser</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      text-align: center;
    }

    .logo {
      font-size: 45px;
      font-weight: bold;
      margin-top: 100px;
      margin-bottom: 30px;
    }

    .search {
      width: 80%;
      max-width: 600px;
      padding: 16px;
      border: 1px solid #ddd;
      border-radius: 30px;
      font-size: 18px;
      outline: none;
    }

    .buttons {
      margin-top: 20px;
    }

    button {
      padding: 12px 20px;
      margin: 5px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="logo">🌐 My Browser</div>

  <input
    id="searchBox"
    class="search"
    type="text"
    placeholder="Search the web..."
  >

  <div class="buttons">
    <button onclick="searchGoogle()">🔍 Search</button>
  </div>

  <script>
    function searchGoogle() {
      let text = document.getElementById("searchBox").value;

      if (text.trim() !== "") {
        window.location.href =
          "https://www.google.com/search?q=" + encodeURIComponent(text);
      }
    }

    document.getElementById("searchBox").addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        searchGoogle();
      }
    });
  </script>

</body>
</html>
